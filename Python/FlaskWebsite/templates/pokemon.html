<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pokemon</title>
    </head>
    <body>
        {% if name %}
            <h1>{{ name }}</h1>
            <img src="{{ image_url }}" alt="Picture of {{ name }} pokemon character">
        {% else %}
            <h1>Pokemon not found</h1>
            <img src="{{ image_url }}" alt="Pokemon logo">
        {% endif %}
    </body>
</html>
